<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设置页信息架构 — LocalSend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
  /* ==========================================================================
     LocalSend 设置页 · 信息架构对比画廊
     设计语言取自 designs/localsend-reimagined（方向 A「Signal」）
     A 现状手风琴 / B 移动端二级页面（首页·详情·搜索）/ C 桌面双栏
     ========================================================================== */

  *, *::before, *::after { box-sizing: border-box; }

  html, body { margin: 0; background: #07080a; }

  body {
    font-family: "Archivo", "Noto Sans SC", -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    color: #edeff2;
  }

  button, input, select { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; }
  a { color: inherit; }
  svg { display: block; }

  /* ---------- studio / tokens ---------- */
  .studio {
    --bg: #0a0b0d;
    --bg2: #101216;
    --bg3: #171a20;
    --fg: #edeff2;
    --muted: #8b929c;
    --faint: #5c636d;
    --line: rgba(255, 255, 255, 0.08);
    --line-strong: rgba(255, 255, 255, 0.16);
    --accent: #c6f24e;
    --accent-fg: #0a0b0d;
    --accent-soft: rgba(198, 242, 78, 0.14);
    --danger: #ff6b57;
    --radius: 16px;
    --radius-sm: 10px;
    --radius-pill: 999px;
    --pad: 16px;
    --font-display: "Archivo", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-body: "Archivo", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-mono: "JetBrains Mono", "Noto Sans SC", "SF Mono", ui-monospace, monospace;
    --display-weight: 700;
    --display-tracking: -0.02em;
    --shell: #07080a;

    min-height: 100vh;
    max-width: 1560px;
    margin: 0 auto;
    padding: 46px 24px 96px;
    background: var(--shell);
    color: var(--fg);
    font-family: var(--font-body);
  }

  .i {
    display: block;
    flex: 0 0 auto;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* ---------- gallery header ---------- */
  .studio-hd { border-bottom: 1px solid var(--line); padding-bottom: 26px; }

  .studio-title {
    margin: 0;
    font-family: var(--font-display);
    font-size: 34px;
    line-height: 1.1;
    font-weight: var(--display-weight);
    letter-spacing: var(--display-tracking);
  }

  .studio-sub {
    margin-top: 10px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--muted);
  }

  .legend {
    margin: 22px 0 0;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--muted);
  }

  /* ---------- board layout ---------- */
  .boards { display: grid; justify-content: center; gap: 52px 40px; margin-top: 40px; }
  .boards-phones { grid-template-columns: repeat(2, 390px); }
  .boards-desk { grid-template-columns: minmax(0, 1fr); margin-top: 62px; }

  .board { display: flex; flex-direction: column; gap: 10px; min-width: 0; margin: 0; }

  .board-label {
    font-family: var(--font-mono);
    font-size: 9.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--faint);
  }

  .board-caption {
    max-width: 390px;
    font-family: var(--font-mono);
    font-size: 10.5px;
    line-height: 1.75;
    letter-spacing: 0.01em;
    color: var(--muted);
    text-wrap: pretty;
  }

  .board-wide { width: 1280px; max-width: 100%; justify-self: center; }
  .board-wide .board-caption { max-width: 840px; }

  .desk-fit {
    position: relative;
    width: 1280px;
    max-width: 100%;
    height: 800px;
    overflow: hidden;
  }

  @media (max-width: 900px) {
    .studio { padding: 32px 16px 64px; }
    .studio-title { font-size: 26px; }
    .boards { gap: 40px 24px; margin-top: 30px; }
    .boards-phones { grid-template-columns: minmax(0, 390px); }
  }

  /* ==========================================================================
     手机画板 —— 复用原型 .phone / .app 结构（无状态栏）
     ========================================================================== */
  .phone {
    width: 390px;
    height: 844px;
    flex: 0 0 auto;
    border-radius: 42px;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.07);
    position: relative;
    display: flex;
    flex-direction: column;
    isolation: isolate;
  }

  /* ---------- app shell ---------- */
  .app {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    padding-top: env(safe-area-inset-top, 0px);
  }

  .hdr {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 20px var(--pad) 10px;
    flex: 0 0 auto;
  }

  .hdr-mark {
    width: 30px;
    height: 30px;
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    border-radius: var(--radius-sm);
    background: var(--accent);
    color: var(--accent-fg);
  }

  .hdr-id { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

  .hdr-alias {
    font-family: var(--font-display);
    font-weight: var(--display-weight);
    letter-spacing: var(--display-tracking);
    font-size: 15px;
    line-height: 1.1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .hdr-sub {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .icon-btn {
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border-radius: var(--radius-sm);
    color: var(--muted);
    transition: background 160ms ease, color 160ms ease;
  }
  .icon-btn:hover { background: var(--bg3); color: var(--fg); }

  .main {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 2px var(--pad) 18px;
    scrollbar-width: none;
  }
  .main::-webkit-scrollbar { width: 0; }
  .main.is-flex { display: flex; flex-direction: column; }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 9.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--faint);
  }

  .grow { flex: 1; min-width: 0; }
  .chev { color: var(--faint); }
  .num { font-variant-numeric: tabular-nums; font-family: var(--font-mono); }
  .row { display: flex; align-items: center; gap: 10px; }

  /* ---------- search / input ---------- */
  .search {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 10px;
    height: 36px;
    border-radius: var(--radius-sm);
    background: var(--bg2);
    border: 1px solid var(--line);
    color: var(--muted);
  }
  .search input {
    flex: 1;
    min-width: 0;
    background: none;
    border: 0;
    outline: none;
    font-size: 12.5px;
    color: var(--fg);
  }
  .search input::placeholder { color: var(--faint); }

  .search-x {
    width: 18px;
    height: 18px;
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    border-radius: 50%;
    color: var(--faint);
    transition: background 140ms ease, color 140ms ease;
  }
  .search-x:hover { background: var(--bg3); color: var(--fg); }

  .input {
    width: 100%;
    height: 34px;
    padding: 0 10px;
    border-radius: var(--radius-sm);
    background: var(--bg2);
    border: 1px solid var(--line);
    font-size: 12.5px;
    color: var(--fg);
    outline: none;
    transition: border-color 140ms ease;
  }
  .input:focus { border-color: var(--accent); }

  /* ---------- switches / segmented / chips ---------- */
  .sw {
    width: 40px;
    height: 24px;
    flex: 0 0 auto;
    border-radius: 999px;
    background: var(--line-strong);
    position: relative;
    transition: background 160ms ease;
    display: inline-block;
  }
  .sw::after {
    content: "";
    position: absolute;
    top: 3px;
    left: 3px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--fg);
    transition: transform 180ms cubic-bezier(0.3, 0.8, 0.3, 1), background 160ms ease;
  }
  .sw.is-on { background: var(--accent); }
  .sw.is-on::after { transform: translateX(16px); background: var(--accent-fg); }

  .seg {
    display: flex;
    gap: 2px;
    padding: 2px;
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
  }
  .seg button {
    flex: 1;
    height: 30px;
    border-radius: calc(var(--radius-sm) - 2px);
    font-size: 11.5px;
    font-family: var(--font-mono);
    letter-spacing: 0.02em;
    color: var(--muted);
    transition: background 140ms ease, color 140ms ease;
  }
  .seg button:hover { color: var(--fg); }
  .seg button.is-on { background: var(--fg); color: var(--bg); }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 24px;
    padding: 0 9px;
    border-radius: var(--radius-pill);
    background: var(--bg3);
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.03em;
    color: var(--muted);
    white-space: nowrap;
  }
  .chip.is-accent { background: var(--accent-soft); color: var(--accent); }
  .chip-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

  .swatches { display: flex; gap: 6px; }
  .swatch {
    width: 20px;
    height: 20px;
    flex: 0 0 auto;
    padding: 0;
    border-radius: 50%;
    border: 1px solid rgba(0, 0, 0, 0.18);
    transition: transform 140ms ease;
  }
  .swatch:hover { transform: scale(1.12); }
  .swatch.is-on { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--fg); }

  /* ---------- A · 手风琴分组（原型 settings） ---------- */
  .group { border-bottom: 1px solid var(--line); }

  .groups { margin-top: 8px; }

  .group-head {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 14px 0;
    text-align: left;
  }

  .group-title {
    display: block;
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: var(--display-weight);
    letter-spacing: var(--display-tracking);
    color: var(--fg);
  }

  .group-sub {
    display: block;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--faint);
    margin-top: 3px;
    letter-spacing: 0.02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .group-body { padding: 0 0 12px; display: flex; flex-direction: column; gap: 2px; }

  .setrow {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 0;
    font-size: 12.5px;
  }
  .setrow .grow { flex: 1; min-width: 0; }
  .setrow-label { line-height: 1.3; color: var(--fg); }
  .setrow-desc { font-size: 10.5px; color: var(--muted); margin-top: 2px; line-height: 1.45; }
  .setrow-value {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--muted);
    white-space: nowrap;
  }
  .setrow.is-block { display: block; }
  .seg.is-block { margin-top: 9px; }

  .shell-hint {
    margin-top: 18px;
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--faint);
    line-height: 1.8;
  }
  .main.is-flex .shell-hint.is-bottom { margin-top: auto; }

  /* ==========================================================================
     B · 分类首页
     ========================================================================== */
  .cat {
    display: flex;
    align-items: center;
    gap: 12px;
    width: calc(100% + 32px);
    margin: 0 -16px;
    padding: 13px 16px;
    min-height: 64px;
    text-align: left;
    border-bottom: 1px solid var(--line);
    transition: background 140ms ease;
  }
  .cat:hover { background: var(--bg3); }
  .cat:active { background: var(--bg2); }
  .cat.is-sel {
    background: rgba(198, 242, 78, 0.06);
    box-shadow: inset 2px 0 0 var(--accent);
  }
  .cat.is-sel:hover { background: rgba(198, 242, 78, 0.1); }

  .cat-glyph {
    width: 30px;
    height: 30px;
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    border-radius: 9px;
    background: var(--bg3);
    color: var(--fg);
  }

  .cat-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .cat-title {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: var(--display-weight);
    letter-spacing: var(--display-tracking);
    line-height: 1.15;
    color: var(--fg);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cat-meta {
    font-family: var(--font-mono);
    font-size: 10px;
    line-height: 1.3;
    letter-spacing: 0.01em;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cat-meta.cat-tags { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .cat-meta-text { font-family: var(--font-mono); font-size: 10px; color: var(--muted); white-space: nowrap; }
  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 8px 4px 7px; border-radius: 999px;
    border: 1px solid var(--line-strong); color: var(--muted);
    font-family: var(--font-mono); font-size: 9.5px; line-height: 1.1; white-space: nowrap;
  }
  .pill .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--faint); }
  .pill.is-on { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
  .pill.is-on .dot { background: var(--accent); }
  .capsule {
    position: relative; width: 40px; height: 24px; border-radius: 999px;
    background: var(--line-strong); flex: 0 0 auto;
  }
  .capsule::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--fg); }
  .capsule.is-on { background: var(--accent); }
  .capsule.is-on::after { left: auto; right: 3px; background: var(--accent-fg); }

  .cat-count {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--faint);
    white-space: nowrap;
  }
  .cat .chev { color: var(--faint); }

  .b-foot { margin-top: auto; padding-top: 16px; }
  .b-links {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 18px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }
  .b-link { font-size: 12px; color: var(--muted); transition: color 140ms ease; }
  .b-link:hover { color: var(--fg); }
  .b-version {
    margin-top: 12px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.02em;
    color: var(--faint);
  }

  /* ==========================================================================
     C · 详情页
     ========================================================================== */
  .c-body { display: flex; flex-direction: column; }
  .c-body .setrow { padding: 10px 0; border-top: 1px solid var(--line); }
  .c-body .setrow:first-child { border-top: 0; }

  .input-inline {
    width: auto;
    height: 30px;
    padding: 0 9px;
    text-align: right;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.02em;
  }
  .inl { display: flex; align-items: center; gap: 6px; }

  .seg-sm { width: 132px; flex: 0 0 auto; }
  .seg-sm button { height: 26px; font-size: 10.5px; }

  .mini-btn {
    width: 30px;
    height: 30px;
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    border-radius: 8px;
    color: var(--muted);
    transition: background 140ms ease, color 140ms ease;
  }
  .mini-btn:hover { background: var(--bg3); color: var(--fg); }

  /* ==========================================================================
     B2 · 搜索结果
     ========================================================================== */
  .result {
    display: flex;
    align-items: center;
    gap: 12px;
    width: calc(100% + 32px);
    margin: 0 -16px;
    padding: 9px 16px;
    text-align: left;
    border-bottom: 1px solid var(--line);
    transition: background 140ms ease;
  }
  .result:hover { background: var(--bg3); }
  .result-main { flex: 1; min-width: 0; }
  .result-crumb {
    display: block;
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.05em;
    color: var(--faint);
    margin-bottom: 3px;
  }
  .result-label { display: block; font-size: 12.5px; line-height: 1.3; color: var(--fg); }
  .result-value {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--muted);
    white-space: nowrap;
  }

  /* ==========================================================================
     C · 桌面双栏
     ========================================================================== */
  #frame-e {
    width: 1280px;
    height: 800px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-radius: 14px;
    background: var(--bg);
    color: var(--fg);
    transform-origin: top left;
    box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.07);
  }

  .win-chrome {
    position: relative;
    height: 34px;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 0 14px;
    border-bottom: 1px solid var(--line);
    background: var(--bg2);
  }
  .tl-dot { width: 9px; height: 9px; border-radius: 50%; background: rgba(255, 255, 255, 0.14); }
  .win-chrome-title {
    position: absolute;
    left: 0;
    right: 0;
    text-align: center;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.04em;
    color: var(--faint);
    pointer-events: none;
  }

  .win-body { flex: 1; min-height: 0; display: flex; overflow: hidden; }

  .rail {
    width: 64px;
    flex: 0 0 auto;
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 14px 0 16px;
    background: var(--bg);
  }
  .rail-mark { margin-bottom: 8px; }
  .rail-btn {
    width: 48px;
    height: 50px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    border-radius: var(--radius-sm);
    color: var(--faint);
    font-family: var(--font-mono);
    font-size: 8.5px;
    line-height: 1.1;
    letter-spacing: 0.04em;
    transition: background 140ms ease, color 140ms ease;
  }
  .rail-btn:hover { background: var(--bg3); color: var(--fg); }
  .rail-btn.is-on { color: var(--fg); }
  .rail-btn.is-on svg { color: var(--accent); }
  .rail-spacer { flex: 1; }

  /* --- 左栏：分类 --- */
  .set-pane {
    width: 280px;
    flex: 0 0 auto;
    border-right: 1px solid var(--line);
    padding: 18px 12px 16px;
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }
  .pane-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 0 10px;
    margin-bottom: 12px;
  }
  .pane-count { font-family: var(--font-mono); font-size: 10px; color: var(--faint); }
  .pane-list { margin-top: 14px; display: flex; flex-direction: column; gap: 1px; }

  .pcat {
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 10px 10px 10px 12px;
    border-radius: 8px;
    text-align: left;
    color: var(--muted);
    transition: background 140ms ease, color 140ms ease;
  }
  .pcat:hover { background: var(--bg3); color: var(--fg); }
  .pcat:hover svg { color: var(--fg); }
  .pcat svg { color: var(--faint); transition: color 140ms ease; }
  .pcat-name {
    flex: 1;
    min-width: 0;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .pcat-count { font-family: var(--font-mono); font-size: 10px; color: var(--faint); }
  .pcat.is-on {
    background: rgba(198, 242, 78, 0.06);
    color: var(--fg);
  }
  .pcat.is-on svg { color: var(--accent); }
  .pcat.is-on::before {
    content: "";
    position: absolute;
    left: 0;
    top: 9px;
    bottom: 9px;
    width: 2px;
    border-radius: 2px;
    background: var(--accent);
  }

  /* --- 右栏：内容 --- */

      return '<button type="button"' + (i === r.index ? ' class="is-on"' : '') + '>' + o + '</button>';

    if (inline) {
      return '<div class="setrow"><div class="grow"><div class="setrow-label">' + r.label + '</div></div>' + seg + '</div>';
    }
    return '<div class="setrow is-block"><div class="setrow-label">' + r.label + '</div>' +
      (r.desc ? '<div class="setrow-desc">' + r.desc + '</div>' : '') + seg + '</div>';
  }

  function renderRow(r) {
    switch (r.t) {
      case 'switch':
        return rowSwitch(r);
      case 'link':
        return rowLink(r, CHEV_R);
      case 'select':
        return rowLink(r, CHEV_D);
      case 'chip':
        return '<div class="setrow"><div class="grow"><div class="setrow-label">' + r.label + '</div></div>' +
          '<span class="chip">' + r.value + '</span></div>';
      case 'segBlock':
        return rowSegment(r, false);
      case 'segInline':
        return rowSegment(r, true);
      case 'input':
        return '<div class="setrow"><div class="grow"><div class="setrow-label">' + r.label + '</div></div>' +
          '<div class="inl"><input class="input input-inline" type="text" value="' + r.value + '" aria-label="' + r.label + '"' +
          (r.w ? ' style="width:' + r.w + 'px"' : '') + '>' +
          (r.suffix ? '<span class="setrow-value">' + r.suffix + '</span>' : '') + '</div></div>';
      case 'swatch':
        return '<div class="setrow"><div class="grow"><div class="setrow-label">' + r.label + '</div></div>' +
          '<div class="swatches">' + COLORS.map(function (c, i) {
            return '<button type="button" class="swatch' + (i === r.index ? ' is-on' : '') +
              '" style="background:' + c + '" aria-label="强调色 ' + (i + 1) + '"></button>';
          }).join('') + '</div></div>';
      case 'server':
        return '<div class="setrow"><div class="grow"><div class="setrow-label">服务器</div></div>' +
          '<span class="chip is-accent"><i class="chip-dot"></i>在线</span>' +
          '<button type="button" class="mini-btn" title="重启服务器" aria-label="重启服务器">' +
          '<svg class="i" width="14" height="14"><use href="#ic-restart"></use></svg></button>' +
          '<button type="button" class="mini-btn" title="停止服务器" aria-label="停止服务器">' +
          '<svg class="i" width="14" height="14"><use href="#ic-stop"></use></svg></button></div>';
      default:
        return '';
    }
  }

  var CATS = {
    device: {
      title: '设备与可见性',
      count: 4,
      hint: '',
      rows: [
        { t: 'input', label: '设备名称', value: 'MacBook Pro', w: 170 },
        { t: 'switch', label: '对本网络可见', on: true },
        { t: 'select', label: '设备类型', value: '笔记本' },
        { t: 'input', label: '设备型号', value: 'MacBook Pro', w: 170 }
      ]
    },
    receive: {
      title: '接收与保存',
      count: 6,
      hint: '这一页只有接收相关设置',
      rows: [
        { t: 'segBlock', label: '自动保存', options: ['关闭', '仅收藏', '全部'], index: 1 },
        { t: 'switch', label: '启用 PIN', on: false },
        { t: 'switch', label: '保存到相册', on: true },
        { t: 'switch', label: '完成后自动关闭会话', on: true },
        { t: 'switch', label: '保存到历史记录', on: true },
        { t: 'switch', label: '接收时验证校验和', on: true }
      ]
    },
    security: {
      title: '安全与分享',
      count: 3,
      hint: '',
      rows: [
        { t: 'switch', label: '加密', on: true },
        { t: 'switch', label: '自动接收链接分享', on: false },
        { t: 'switch', label: '发送时创建校验和', on: true }
      ]
    },
    appearance: {
      title: '外观与语言',
      count: 6,
      hint: '',
      rows: [
        { t: 'segBlock', label: '主题', options: ['跟随系统', '深色', '浅色'], index: 1 },
        { t: 'select', label: '配色', value: 'OLED' },
        { t: 'swatch', label: '强调色', index: 0 },
        { t: 'segInline', label: '附近页布局', options: ['网格', '雷达'], index: 0 },
        { t: 'link', label: '语言', value: '简体中文' },
        { t: 'switch', label: '动画效果', on: true }
      ]
    },
    network: {
      title: '网络与服务器',
      count: 6,
      hint: '',
      rows: [
        { t: 'server' },
        { t: 'input', label: '端口', value: '53317', w: 110 },
        { t: 'input', label: '多播地址', value: '224.0.0.167', w: 140 },
        { t: 'input', label: '搜索设备超时', value: '500', suffix: 'ms', w: 76 },
        { t: 'link', label: '网络接口', value: '所有' },
        { t: 'link', label: '调试与日志' }
      ]
    }
  };

  var titleEl = document.getElementById('c-title');
  var subEl = document.getElementById('c-sub');
  var bodyEl = document.getElementById('c-body');
  var hintEl = document.getElementById('c-hint');
  var catBtns = document.querySelectorAll('#frame-b .cat');

  function render(key) {
    var c = CATS[key];
    if (!c) return;

    titleEl.textContent = c.title;
    subEl.textContent = c.count + ' 项';
    bodyEl.innerHTML = c.rows.map(renderRow).join('');
    hintEl.textContent = c.hint;

    for (var i = 0; i < catBtns.length; i++) {
      var on = catBtns[i].getAttribute('data-cat') === key;
      catBtns[i].classList.toggle('is-sel', on);
      catBtns[i].setAttribute('aria-pressed', on ? 'true' : 'false');
    }
  }

  for (var i = 0; i < catBtns.length; i++) {
    catBtns[i].addEventListener('click', function () {
      render(this.getAttribute('data-cat'));
    });
  }

  /* ------------------------------------------------------------------------
     桌面画板：窄屏时整体等比缩放，页面永不横向溢出
     ------------------------------------------------------------------------ */
  var deskFit = document.getElementById('desk-fit');
  var deskWin = document.getElementById('frame-e');

  function fitDesk() {
    if (!deskFit || !deskWin || !deskFit.parentElement) return;
    var avail = deskFit.parentElement.clientWidth;
    var scale = Math.min(1, avail / 1280);

    deskWin.style.transformOrigin = 'top left';
    deskWin.style.transform = scale < 1 ? 'scale(' + scale + ')' : 'none';
    deskFit.style.height = Math.round(800 * scale) + 'px';
  }

  window.addEventListener('resize', fitDesk);
  fitDesk();
})();
</script>
</body>
</html>
