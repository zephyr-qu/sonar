<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalSend</title>
    <style>
        /* ============================================================
           LocalSend web upload page — "Signal" redesign match.
           Visually mirrors designs/localsend-reimagined (Archivo,
           JetBrains Mono, accent #C6F24E on #0A0B0D). The <script>
           block below is unchanged; only the look was reskinned.
           DOM ids (#content, #upload-button, #drop-hint, #file-input,
           #status-text, #progress-text) and i18n keys stay the same.
           ============================================================ */

        *, *::before, *::after { box-sizing: border-box; }

        :root {
            --bg: #0A0B0D;
            --bg2: #101216;
            --bg3: #171A20;
            --fg: #EDEFF2;
            --muted: #9AA1AC;
            --faint: #7E8590;
            --line: rgba(255, 255, 255, 0.08);
            --line-strong: rgba(255, 255, 255, 0.16);
            --accent: #C6F24E;
            --accent-fg: #0A0B0D;
            --accent-soft: rgba(198, 242, 78, 0.14);
            --danger: #FF6B57;
            --radius: 16px;
            --radius-sm: 10px;
            --pad: 16px;
            --font-body: "Archivo", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
            --font-mono: "JetBrains Mono", "Noto Sans SC", "SF Mono", ui-monospace, monospace;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            background: var(--bg);
            color: var(--fg);
            font-family: var(--font-body);
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 28px var(--pad) 40px;
            background:
                radial-gradient(900px 600px at 50% -10%, rgba(198, 242, 78, 0.06), transparent 60%),
                var(--bg);
        }

        .screen {
            width: 100%;
            max-width: 440px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .brand-mark {
            width: 32px;
            height: 32px;
            flex: 0 0 auto;
            display: grid;
            place-items: center;
            border-radius: var(--radius-sm);
            background: var(--accent);
            color: var(--accent-fg);
        }

        .brand-name {
            font-family: var(--font-body);
            font-weight: 700;
            font-size: 15px;
            letter-spacing: -0.02em;
        }

        .eyebrow {
            font-family: var(--font-mono);
            font-size: 9.5px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--faint);
            margin: 0 0 6px;
        }

        h1 {
            font-family: var(--font-body);
            font-size: 30px;
            line-height: 1.08;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin: 0 0 6px;
        }

        .lede {
            font-size: 12.5px;
            line-height: 1.6;
            color: var(--muted);
            margin: 0 0 18px;
        }

        #content {
            box-sizing: border-box;
            width: 100%;
            margin: 0 auto;
            padding: 28px 22px;
            background: var(--bg2);
            border: 1.5px dashed var(--line-strong);
            border-radius: var(--radius);
            text-align: center;
            transition: border-color 150ms ease, background 150ms ease;
        }

        #content.drag-over {
            border-color: var(--accent);
            background: var(--accent-soft);
        }

        #upload-button {
            width: 100%;
            padding: 13px 16px;
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--accent-fg);
            background: var(--accent);
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: filter 150ms ease, transform 150ms ease;
        }

        #upload-button:hover {
            filter: brightness(1.05);
        }

        #upload-button:active {
            transform: translateY(1px);
        }

        #status-text {
            display: none;
            font-size: 13px;
            color: var(--muted);
        }

        /* Prototype-style inline alert instead of plain red text */
        #status-text.error {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 14px;
            border: 1px solid var(--danger);
            background: rgba(255, 107, 87, 0.10);
            border-radius: var(--radius-sm);
            font-family: var(--font-body);
            line-height: 1.4;
            color: var(--danger);
        }

        /* PIN entry overlay — replaces the native window.prompt */
        .pin-overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(5, 6, 8, 0.72);
            backdrop-filter: blur(6px);
            z-index: 50;
        }

        .pin-overlay.show { display: flex; }

        .pin-card {
            width: 100%;
            max-width: 360px;
            padding: 24px;
            background: var(--bg2);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
        }

        .pin-card h2 {
            margin: 0 0 18px;
            font-size: 20px;
            font-weight: 600;
            color: var(--fg);
        }

        .pin-input {
            width: 100%;
            margin: 0 0 14px;
            padding: 12px 14px;
            background: var(--bg3);
            border: 1px solid var(--line-strong);
            border-radius: var(--radius-sm);
            color: var(--fg);
            font-family: var(--font-mono);
            font-size: 16px;
            letter-spacing: 0.18em;
            outline: none;
        }

        .pin-input:focus { border-color: var(--accent); }

        .pin-error {
            min-height: 18px;
            margin: 0 0 14px;
            font-size: 12px;
            color: var(--danger);
        }

        .pin-actions {
            display: flex;
            gap: 10px;
        }

        .pin-actions button {
            flex: 1;
            padding: 11px 14px;
            border: 1px solid transparent;
            border-radius: var(--radius-sm);
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .pin-btn-cancel {
            background: transparent;
            border-color: var(--line-strong);
            color: var(--muted);
        }

        .pin-btn-confirm {
            background: var(--accent);
            color: var(--accent-fg);
        }

        .pin-btn-confirm:active { transform: translateY(1px); }

        #progress-text {
            display: none;
            font-family: var(--font-mono);
            font-size: 12px;
            letter-spacing: 0.02em;
            color: var(--accent);
        }

        #drop-hint {
            margin-top: 12px;
            font-size: 12px;
            color: var(--faint);
        }

        .footer {
            margin-top: 22px;
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.02em;
            color: var(--faint);
            text-align: center;
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>
<body>
<noscript>
    LocalSend requires JavaScript, which is currently disabled. Please enable it and try again.
</noscript>

<div class="screen">
    <div class="brand">
        <div class="brand-mark" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M12 3 4 11h4v7h8v-7h4L12 3Z" fill="currentColor"/>
            </svg>
        </div>
        <div class="brand-name">LocalSend</div>
    </div>

    <p class="eyebrow">Upload</p>
    <h1>Send files</h1>
    <p class="lede">Drop files here or choose them to send to this device.</p>

    <div id="content">
        <button id="upload-button" type="button">Upload</button>
        <p id="drop-hint">Place items to share.</p>
        <input id="file-input" type="file" multiple style="display: none">
        <p id="status-text"></p>
        <p id="progress-text"></p>
    </div>

    <div class="footer">LocalSend · secure local-network transfer</div>

    <div class="pin-overlay" id="pin-overlay">
        <div class="pin-card" role="dialog" aria-modal="true" aria-labelledby="pin-title">
            <h2 id="pin-title">Enter PIN</h2>
            <input class="pin-input" id="pin-input" type="text" inputmode="numeric"
                   autocomplete="off" maxlength="64" aria-label="PIN">
            <p class="pin-error" id="pin-error"></p>
            <div class="pin-actions">
                <button class="pin-btn-cancel" id="pin-cancel" type="button">Cancel</button>
                <button class="pin-btn-confirm" id="pin-confirm" type="button">Confirm</button>
            </div>
        </div>
    </div>
</div>

<script>
    var BASE_URL = '/api/localsend/v2';

    var i18n = {};
    var queryParams = location.search.slice(1).split('&');
    var pin = null;
    var uploading = false;
    // dragenter/dragleave fire for every nested element, so the drop zone is only left when this reaches zero.
    var dragDepth = 0;

    // Parse query parameters manually for IE
    for (var i = 0; i < queryParams.length; i++) {
      var pair = queryParams[i].split('=');
      if (pair[0] === 'pin') {
        pin = decodeURIComponent(pair[1]);
        break;
      }
    }

    function makeRequest(url, method, body, callback) {
      var xhr = new XMLHttpRequest();
      xhr.open(method, url, true);
      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4) {
          callback(xhr);
        }
      };
      xhr.send(body);
    }

    // Custom PIN entry modal — replaces the native window.prompt so the
    // browser experience matches the prototype. callback(pin) on confirm,
    // callback(null) on cancel.
    function showPinOverlay(message, callback) {
      var overlay = document.getElementById('pin-overlay');
      var title = document.getElementById('pin-title');
      var input = document.getElementById('pin-input');
      var error = document.getElementById('pin-error');
      var confirmBtn = document.getElementById('pin-confirm');
      var cancelBtn = document.getElementById('pin-cancel');

      title.innerText = 'Enter PIN';
      error.innerText = message || '';
      input.value = '';
      overlay.className = 'pin-overlay show';

      function close(result) {
        overlay.className = 'pin-overlay';
        confirmBtn.onclick = null;
        cancelBtn.onclick = null;
        input.onkeydown = null;
        overlay.onclick = null;
        callback(result);
      }

      function submit() {
        var value = input.value;
        if (!value) {
          error.innerText = i18n.invalidPin;
          return;
        }
        close(value);
      }

      confirmBtn.onclick = submit;
      cancelBtn.onclick = function () { close(null); };
      input.onkeydown = function (e) {
        if (e.keyCode === 27) { close(null); }
        else if (e.keyCode === 13) { submit(); }
      };
      overlay.onclick = function (e) {
        if (e.target === overlay) { close(null); }
      };

      input.focus();
    }

    function fetchI18n(then) {
      makeRequest('/i18n.json', 'GET', null, function (response) {
        if (response.status !== 200) {
          alert('Could not load translations. Please reload the page to try again.');
          return;
        }
        try {
          i18n = JSON.parse(response.responseText);
        } catch (e) {
          alert('Could not parse translations. Please reload the page to try again.');
          return;
        }
        if (i18n.dropHint) {
          document.getElementById('drop-hint').innerText = i18n.dropHint;
        }
        then();
      });
    }

    function setButtonVisible(visible) {
      document.getElementById('upload-button').style.display = visible ? 'block' : 'none';
      document.getElementById('drop-hint').style.display = visible ? 'block' : 'none';
    }

    function setDragOver(active) {
      document.getElementById('content').className = active ? 'drag-over' : '';
    }

    function isFileDrag(e) {
      var types = e.dataTransfer && e.dataTransfer.types;
      if (!types) {
        return false;
      }
      for (var i = 0; i < types.length; i++) {
        if (types[i] === 'Files') {
          return true;
        }
      }
      return false;
    }

    function getDroppedFiles(dataTransfer) {
      var files = [];
      var items = dataTransfer.items;
      if (items && items.length > 0 && items[0].webkitGetAsEntry) {
        for (var i = 0; i < items.length; i++) {
          // Directories cannot be read as blobs, so uploading them would fail midway; skip them.
          var entry = items[i].webkitGetAsEntry();
          if (entry && entry.isDirectory) {
            continue;
          }
          var file = items[i].getAsFile();
          if (file) {
            files.push(file);
          }
        }
      } else {
        for (var i = 0; i < dataTransfer.files.length; i++) {
          files.push(dataTransfer.files[i]);
        }
      }
      return files;
    }

    function showStatus(text, isError) {
      var statusText = document.getElementById('status-text');
      statusText.style.display = text ? 'block' : 'none';
      statusText.className = isError ? 'error' : '';
      statusText.innerText = text;
    }

    function showProgress(finished, total) {
      var progressText = document.getElementById('progress-text');
      progressText.style.display = 'block';
      progressText.innerText = finished + '/' + total + ' file(s)';
    }

    function hideProgress() {
      document.getElementById('progress-text').style.display = 'none';
    }

    // Ends the upload flow: keeps the error visible and lets the user try again.
    function finishWithError(text) {
      uploading = false;
      showStatus(text, true);
      setButtonVisible(true);
    }

    // Ends the upload flow after all files have been sent.
    function finishWithSuccess() {
      uploading = false;
      showStatus('');
      setButtonVisible(true);
    }

    function startUpload(fileList) {
      uploading = true;
      setButtonVisible(false);
      hideProgress();
      showStatus(i18n.waiting);

      var selectedFiles = {};
      var filesDto = {};
      for (var i = 0; i < fileList.length; i++) {
        var file = fileList[i];
        var fileId = String(i);
        selectedFiles[fileId] = file;
        filesDto[fileId] = {
          id: fileId,
          fileName: file.name,
          size: file.size,
          fileType: file.type || 'application/octet-stream'
        };
      }

      var body = JSON.stringify({
        info: {
          alias: 'Web Browser',
          version: '2.1',
          deviceType: 'web',
          fingerprint: getFingerprint(),
          port: 0,
          protocol: location.protocol === 'https:' ? 'https' : 'http',
          download: false
        },
        files: filesDto
      });

      prepareUpload(body, selectedFiles, true);
    }

    function prepareUpload(body, selectedFiles, firstAttempt) {
      var url = BASE_URL + '/prepare-upload';
      if (pin) {
        url += '?pin=' + encodeURIComponent(pin);
      }

      makeRequest(url, 'POST', body, function (response) {
        if (response.status === 401) {
          showPinOverlay(firstAttempt ? i18n.enterPin : i18n.invalidPin, function (newPin) {
            if (newPin === null) {
              finishWithError(i18n.invalidPin);
              return;
            }
            pin = newPin;
            prepareUpload(body, selectedFiles, false);
          });
          return;
        }

        if (response.status === 429) {
          finishWithError(i18n.tooManyAttempts);
          return;
        }

        if (response.status === 403) {
          finishWithError(i18n.uploadRejected);
          return;
        }

        if (response.status === 409) {
          finishWithError(i18n.busy);
          return;
        }

        if (response.status === 204) {
          // The recipient accepted the request but declined every file.
          finishWithError(i18n.uploadRejected);
          return;
        }

        if (response.status !== 200) {
          finishWithError(errorText(response.status));
          return;
        }

        var data = JSON.parse(response.responseText);
        uploadFiles(data.sessionId, data.files, selectedFiles);
      });
    }

    function uploadFiles(sessionId, tokens, selectedFiles) {
      var fileIds = getKeys(tokens);
      var total = fileIds.length;

      showStatus('');
      showProgress(0, total);

      function uploadNext(index) {
        if (index >= total) {
          finishWithSuccess();
          return;
        }

        var fileId = fileIds[index];
        var url = BASE_URL + '/upload' +
            '?sessionId=' + encodeURIComponent(sessionId) +
            '&fileId=' + encodeURIComponent(fileId) +
            '&token=' + encodeURIComponent(tokens[fileId]);

        makeRequest(url, 'POST', selectedFiles[fileId], function (response) {
          if (response.status !== 200) {
            finishWithError(errorText(response.status));
            return;
          }

          showProgress(index + 1, total);
          uploadNext(index + 1);
        });
      }

      uploadNext(0);
    }

    function getFingerprint() {
      var fingerprint = sessionStorage.getItem('fingerprint');
      if (!fingerprint) {
        fingerprint = 'web-';
        for (var i = 0; i < 32; i++) {
          fingerprint += Math.floor(Math.random() * 16).toString(16);
        }
        sessionStorage.setItem('fingerprint', fingerprint);
      }
      return fingerprint;
    }

    // A status of 0 means the request never completed (connection lost or aborted by the recipient).
    function errorText(status) {
      return status ? 'Error: ' + status : 'Error';
    }

    function getKeys(obj) {
      var keys = [];
      for (var key in obj) {
        keys.push(key);
      }
      return keys;
    }

    function init() {
      var fileInput = document.getElementById('file-input');
      document.getElementById('upload-button').onclick = function () {
        fileInput.click();
      };
      fileInput.onchange = function () {
        if (fileInput.files.length > 0) {
          startUpload(fileInput.files);
          // Reset the input so selecting the same files again fires this event.
          fileInput.value = '';
        }
      };

      document.addEventListener('dragenter', function (e) {
        if (!isFileDrag(e)) {
          return;
        }
        e.preventDefault();
        if (uploading) {
          return;
        }
        dragDepth++;
        setDragOver(true);
      });
      document.addEventListener('dragover', function (e) {
        if (!isFileDrag(e)) {
          return;
        }
        e.preventDefault();
        if (uploading) {
          e.dataTransfer.dropEffect = 'none';
        }
      });
      document.addEventListener('dragleave', function (e) {
        if (!isFileDrag(e) || dragDepth === 0) {
          return;
        }
        dragDepth--;
        if (dragDepth === 0) {
          setDragOver(false);
        }
      });
      document.addEventListener('drop', function (e) {
        if (!isFileDrag(e)) {
          return;
        }
        e.preventDefault();
        dragDepth = 0;
        setDragOver(false);
        if (uploading) {
          return;
        }
        var files = getDroppedFiles(e.dataTransfer);
        if (files.length > 0) {
          startUpload(files);
        }
      });

      fetchI18n(function () {});
    }

    init();
</script>
</body>
</html>
