# Sonar 落地页作为 Cloudflare Workers 静态资源，挂在 https://www.zephyrqu.top/sonar/。
# 形态照 kanso 的落地页（F:/golang/kanso/apps/landing），只换名字与路径。
#
#   wrangler deploy --dry-run   # 只校验配置，不上传
#   wrangler deploy             # 上传本目录（按 .assetsignore 过滤），再挂上路由
#
# Worker 用 route 挂在 zone 上，所以页面位于 /sonar/ 而不是 zone 根。文件仍在自己的根目录，
# 前缀由 _redirects 代理掉，页面里的路径因此保持相对，同一份文件也能双击本地打开。
#
# 不用 wrangler dev：配置与目录同级时，wrangler 写进 .wrangler/tmp 的产物落在被监听的目录里，
# 会反复触发重建。本地预览直接打开 index.html。

name = "sonar"
compatibility_date = "2026-11-22"

# 两条 pattern 都要写，* 不覆盖裸路径，少了第二条 /sonar（无斜杠）到不了这个 Worker。
[[routes]]
pattern = "www.zephyrqu.top/sonar/*"
zone_name = "zephyrqu.top"

[[routes]]
pattern = "www.zephyrqu.top/sonar"
zone_name = "zephyrqu.top"

[assets]
directory = "./"

# 不设 not_found_handling：这页没有客户端路由，未知路径应当 404，而不是回落到首页。
