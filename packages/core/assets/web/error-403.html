<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonar</title>
    <style>
        /* ============================================================
           Sonar 403 page — "Signal" redesign match.
           Mirrors the "Signal" redesign (Archivo, accent
           #C6F24E on #0A0B0D).
           ============================================================ */

        *, *::before, *::after { box-sizing: border-box; }

        :root {
            --bg: #0A0B0D;
            --bg2: #101216;
            --fg: #EDEFF2;
            --muted: #9AA1AC;
            --faint: #7E8590;
            --line: rgba(255, 255, 255, 0.08);
            --line-strong: rgba(255, 255, 255, 0.16);
            --accent: #C6F24E;
            --accent-fg: #0A0B0D;
            --danger: #FF6B57;
            --radius: 16px;
            --radius-sm: 10px;
            --font-body: "Archivo", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
            --font-mono: "JetBrains Mono", "Noto Sans SC", "SF Mono", ui-monospace, monospace;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            background: var(--bg);
            color: var(--fg);
            font-family: var(--font-body);
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 28px 24px 40px;
            text-align: center;
            background:
                radial-gradient(900px 600px at 50% -10%, rgba(198, 242, 78, 0.06), transparent 60%),
                var(--bg);
        }

        .screen {
            width: 100%;
            max-width: 440px;
            background: var(--bg2);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 32px 26px;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 22px;
        }

        .brand-mark {
            width: 32px;
            height: 32px;
            flex: 0 0 auto;
            display: grid;
            place-items: center;
            border-radius: var(--radius-sm);
            background: var(--accent);
            color: var(--accent-fg);
        }

        .brand-name {
            font-family: var(--font-body);
            font-weight: 700;
            font-size: 15px;
            letter-spacing: -0.02em;
        }

        .code {
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--danger);
            margin: 0 0 8px;
        }

        h1 {
            font-family: var(--font-body);
            font-size: 28px;
            line-height: 1.1;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin: 0 0 10px;
        }

        p {
            font-size: 13px;
            line-height: 1.6;
            color: var(--muted);
            margin: 0;
        }

        .footer {
            margin-top: 22px;
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.02em;
            color: var(--faint);
            text-align: center;
        }
    </style>
</head>
<body>
<div class="screen">
    <div class="brand">
        <div class="brand-mark" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M12 3 4 11h4v7h8v-7h4L12 3Z" fill="currentColor"/>
            </svg>
        </div>
        <div class="brand-name">Sonar</div>
    </div>

    <p class="code">403 Forbidden</p>
    <h1>Web sharing is off</h1>
    <p>You don't have permission to access this resource. Enable web sharing in the Sonar app to receive files through a browser.</p>

</div>
</body>
</html>
